# Re-renders the README cards (GitHub stats, LeetCode, icons, badges) daily and on every
# change to the generator. A failed fetch keeps the last good values, never a blank card.
name: Render README SVGs

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/render.yml

permissions:
  contents: write

concurrency:
  group: render-readme-svgs
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render cards and README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/svg README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh readme cards"
            git pull --rebase --autostash origin main
            git push
          else
            echo "Nothing to commit"
          fi

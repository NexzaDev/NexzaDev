# Generates the contribution snake SVGs and pushes them to the "output" branch.
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1E90FF&color_dots=#ebedf0,#b3ffe0,#66ffc4,#00cc7d,#00FF9C
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#1E90FF&color_dots=#161b22,#003d28,#00704a,#00b870,#00FF9C

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

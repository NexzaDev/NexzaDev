<svg xmlns="http://www.w3.org/2000/svg" width="400" height="330" viewBox="0 0 400 330" role="img" aria-label="NexzaDev. Network Engineer · Developer · Cyber Security. Greece."><style>.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1.2px}.n{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-1px}.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:600}.t{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:700}.now{animation:ring 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes ring{0%{opacity:0.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}</style><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/></pattern><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1a24"/><stop offset="0.7" stop-color="#0b1012"/></linearGradient><linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0"/><stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.10"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><clipPath id="card"><rect x="1" y="1" width="398" height="328" rx="18"/></clipPath></defs><rect x="0.5" y="0.5" width="399" height="329" rx="18" fill="url(#bg)" stroke="rgba(255,255,255,0.09)"/><g clip-path="url(#card)"><rect width="400" height="330" fill="url(#grid)"/><rect x="-200" y="0" width="200" height="330" fill="url(#scan)"><animateTransform attributeName="transform" type="translate" values="0 0;800 0" dur="7s" repeatCount="indefinite"/></rect></g><text class="m" x="28" y="56" fill="#60a5fa" font-size="11">HI, I AM</text><text class="n" x="24" y="100" fill="#f8fafc" font-size="44">NexzaDev</text><text class="s" x="28" y="134" fill="rgba(255,255,255,0.85)" font-size="13">Network Engineer · Developer · Cyber Security</text><text class="s" x="28" y="158"  fill="rgba(255,255,255,0.6)" font-size="13">Networks, protocols and defensive security.<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="12.0s" repeatCount="indefinite"/></text><text class="s" x="28" y="158"  fill="rgba(255,255,255,0.6)" font-size="13" opacity="0">Understand the service before testing it.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.46;0.5;1" dur="12.0s" repeatCount="indefinite"/></text><text class="s" x="28" y="158"  fill="rgba(255,255,255,0.6)" font-size="13" opacity="0">Report findings, never exploit them.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.54;0.71;0.75;1" dur="12.0s" repeatCount="indefinite"/></text><text class="s" x="28" y="158"  fill="rgba(255,255,255,0.6)" font-size="13" opacity="0">Web and scripting support the network work.<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.79;0.96;1" dur="12.0s" repeatCount="indefinite"/></text><rect x="28" y="180" width="213" height="28" rx="14" fill="#22c55e14" stroke="#22c55e55"/><circle cx="46" cy="194" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/></circle><text class="m" x="58" y="198" fill="#22c55e" font-size="10.5" style="letter-spacing:1px">OPEN TO SECURITY PROJECTS</text><text class="m" x="255" y="198" fill="rgba(255,255,255,0.6)" font-size="10.5" style="letter-spacing:1px">GREECE</text><line x1="131.5" y1="271.0" x2="231.5" y2="295.0" stroke="rgba(255,255,255,0.12)" stroke-width="1"/><line x1="269.0" y1="266.0" x2="231.5" y2="295.0" stroke="rgba(255,255,255,0.12)" stroke-width="1"/><line x1="344.0" y1="306.0" x2="231.5" y2="295.0" stroke="rgba(255,255,255,0.12)" stroke-width="1"/><line x1="219.0" y1="326.0" x2="231.5" y2="295.0" stroke="rgba(255,255,25
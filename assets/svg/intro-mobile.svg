<svg xmlns="http://www.w3.org/2000/svg" width="400" height="464" viewBox="0 0 400 464" role="img" aria-label="About Nexza: self-taught engineer in Greece working across networking, development and security. Currently hardening Nmap-NSE-Script-Collection."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b22"/><stop offset="0.7" stop-color="#0d1117"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/></pattern><linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#00FF9C" stop-opacity="0"/><stop offset="0.5" stop-color="#00FF9C" stop-opacity="0.10"/><stop offset="1" stop-color="#00FF9C" stop-opacity="0"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#00FF9C"/><stop offset="1" stop-color="#1E90FF"/></linearGradient><clipPath id="c"><rect x="1" y="1" width="398" height="462" rx="16"/></clipPath></defs><rect x="0.5" y="0.5" width="399" height="463" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.09)"/><g clip-path="url(#c)"><rect width="400" height="464" fill="url(#grid)"/></g><text x="24" y="40" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >Self-taught engineer based in Greece,</text><text x="24" y="60" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >working at the intersection of</text><text x="24" y="80" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >networking, software development and</text><text x="24" y="100" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >security. I build open source tools with</text><text x="24" y="120" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >a focus on defensive auditing and</text><text x="24" y="140" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >practical automation.</text><text x="24" y="174" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >My core work is Nmap NSE scripts in Lua</text><text x="24" y="194" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >for network service auditing,</text><text x="24" y="214" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >complemented by web development with</text><text x="24" y="234" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >Next.js and React, Discord platform</text><text x="24" y="254" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >automation. Everything I publish is safe</text><text x="24" y="274" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >on production infrastructure and clearly</text><text x="24" y="294" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >documented.</text><text x="24" y="328" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >I learn by reading the documentation,</text><text x="24" y="348" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >building a minimal implementation and</text><text x="24" y="368" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c9d1d9" >stress testing it myself.</text><rect x="24" y="400" width="352" height="46" rx="10" fill="rgba(0,255,156,0.06)" stroke="rgba(0,255,156,0.25)"/><text x="38" y="428" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#00FF9C" letter-spacing="2">CURRENTLY</text><text x="120" y="428" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#ffffff" >Hardening Nmap-NSE-Script-Collection</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="384" viewBox="0 0 400 384" role="img" aria-label="About NexzaDev: self-taught network engineer in Greece. Currently hardening Nmap-NSE-Script-Collection."><style>.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1.2px}.n{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-1px}.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:600}.t{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:700}.now{animation:ring 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes ring{0%{opacity:0.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}</style><rect x="0.5" y="0.5" width="399" height="383" rx="14" fill="#0b1012" stroke="rgba(255,255,255,0.08)"/><rect x="0" y="22" width="3" height="28" rx="1.5" fill="#60a5fa"/><text class="m" x="24" y="32" fill="#60a5fa" font-size="10.5">ABOUT</text><text class="s" x="24" y="54" fill="#cbd5e1" font-size="13" style="font-weight:500">Network engineer and security-minded</text><text class="s" x="24" y="74" fill="#cbd5e1" font-size="13" style="font-weight:500">developer focused on networking,</text><text class="s" x="24" y="94" fill="#cbd5e1" font-size="13" style="font-weight:500">protocols and defensive security. Web</text><text class="s" x="24" y="114" fill="#cbd5e1" font-size="13" style="font-weight:500">development and scripting support that</text><text class="s" x="24" y="134" fill="#cbd5e1" font-size="13" style="font-weight:500">work.</text><text class="s" x="24" y="166" fill="#cbd5e1" font-size="13" style="font-weight:500">Open-source tools are documented,</text><text class="s" x="24" y="186" fill="#cbd5e1" font-size="13" style="font-weight:500">informational and designed to report</text><text class="s" x="24" y="206" fill="#cbd5e1" font-size="13" style="font-weight:500">findings rather than exploit systems.</text><text class="s" x="24" y="238" fill="#cbd5e1" font-size="13" style="font-weight:500">Fully self-taught. I learn by reading</text><text class="s" x="24" y="258" fill="#cbd5e1" font-size="13" style="font-weight:500">the documentation, building a minimal</text><text class="s" x="24" y="278" fill="#cbd5e1" font-size="13" style="font-weight:500">implementation, then stress testing it</text><text class="s" x="24" y="298" fill="#cbd5e1" font-size="13" style="font-weight:500">myself.</text><rect x="24" y="326" width="352" height="44" rx="10" fill="#2563eb14" stroke="#2563eb66"/><text class="m" x="38" y="353" fill="#60a5fa" font-size="10.5">CURRENTLY</text><text class="m" x="136" y="353" fill="#f3f4f6" font-size="10">Hardening Nmap-NSE-Script-Collection</text></svg>

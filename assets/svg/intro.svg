<svg xmlns="http://www.w3.org/2000/svg" width="840" height="328" viewBox="0 0 840 328" role="img" aria-label="About Nexza: self-taught engineer in Greece working across networking, development and security. Currently hardening Nmap-NSE-Script-Collection."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1b22"/><stop offset="0.7" stop-color="#0d1117"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/></pattern><linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-color="#00FF9C" stop-opacity="0"/><stop offset="0.5" stop-color="#00FF9C" stop-opacity="0.10"/><stop offset="1" stop-color="#00FF9C" stop-opacity="0"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#00FF9C"/><stop offset="1" stop-color="#1E90FF"/></linearGradient><clipPath id="c"><rect x="1" y="1" width="838" height="326" rx="16"/></clipPath></defs><rect x="0.5" y="0.5" width="839" height="327" rx="16" fill="url(#bg)" stroke="rgba(255,255,255,0.09)"/><g clip-path="url(#c)"><rect width="840" height="328" fill="url(#grid)"/></g><text x="32" y="40" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" >Self-taught engineer based in Greece, working at the intersection of networking, software</text><text x="32" y="63" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" >development and security. I build open source tools with a focus on defensive auditing and</text><text x="32" y="86" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" >practical automation.</text><text x="32" y="123" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" >My core work is Nmap NSE scripts in Lua for network service auditing, complemented by web</text><text x="32" y="146" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" >development with Next.js and React, Discord platform automation. Everything I publish is</text><text x="32" y="169" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" >safe on production infrastructure and clearly documented.</text><text x="32" y="206" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" >I learn by reading the documentation, building a minimal implementation and stress testing</text><text x="32" y="229" font-family="'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#c9d1d9" >it myself.</text><rect x="32" y="264" width="776" height="46" rx="10" fill="rgba(0,255,156,0.06)" stroke="rgba(0,255,156,0.25)"/><text x="46" y="292" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#00FF9C" letter-spacing="2">CURRENTLY</text><text x="128" y="292" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#ffffff" >Hardening Nmap-NSE-Script-Collection</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="288" viewBox="0 0 840 288" role="img" aria-label="About NexzaDev: self-taught network engineer in Greece. Currently building argus-asm."><style>.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1.2px}.n{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-1px}.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:600}.t{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:700}.now{animation:ring 2.2s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes ring{0%{opacity:0.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}</style><rect x="0.5" y="0.5" width="839" height="287" rx="14" fill="#0b1012" stroke="rgba(255,255,255,0.08)"/><rect x="0" y="22" width="3" height="28" rx="1.5" fill="#60a5fa"/><text class="m" x="36" y="32" fill="#60a5fa" font-size="10.5">ABOUT</text><text class="s" x="36" y="54" fill="#cbd5e1" font-size="15" style="font-weight:500">Network engineer and security-minded developer focused on networking, protocols and</text><text class="s" x="36" y="78" fill="#cbd5e1" font-size="15" style="font-weight:500">defensive security. Web development and scripting support that work.</text><text class="s" x="36" y="114" fill="#cbd5e1" font-size="15" style="font-weight:500">Open-source tools are documented, informational and designed to report findings rather than</text><text class="s" x="36" y="138" fill="#cbd5e1" font-size="15" style="font-weight:500">exploit systems.</text><text class="s" x="36" y="174" fill="#cbd5e1" font-size="15" style="font-weight:500">Fully self-taught. I learn by reading the documentation, building a minimal implementation,</text><text class="s" x="36" y="198" fill="#cbd5e1" font-size="15" style="font-weight:500">then stress testing it myself.</text><rect x="36" y="230" width="768" height="44" rx="10" fill="#2563eb14" stroke="#2563eb66"/><text class="m" x="50" y="257" fill="#60a5fa" font-size="10.5">CURRENTLY</text><text class="m" x="148" y="257" fill="#f3f4f6" font-size="12.5">Building argus-asm</text></svg>

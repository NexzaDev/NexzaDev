<svg xmlns="http://www.w3.org/2000/svg" width="320" height="312" viewBox="0 0 320 312" role="img" aria-label="argus-asm: Local-first Attack Surface Management CLI for defensive teams: scope-first asset inventory, findings import from CSV, JSON and SARIF, explainable risk scores, remediation tickets and a hash-chained audit log. One SQLite file, no account or server."><style>.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1px}.t{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800}.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}</style><defs><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="c"><rect x="1" y="1" width="318" height="310" rx="16"/></clipPath></defs><rect x="0.5" y="0.5" width="319" height="311" rx="16" fill="#0f171c" stroke="rgba(255,255,255,0.09)"/><rect x="0" y="22" width="3" height="28" rx="1.5" fill="#60a5fa"/><text class="m" x="22" y="34" fill="#60a5fa" font-size="10.5">EARLY DEVELOPMENT</text><text class="m" x="298" y="34" text-anchor="end" fill="#a8b4c1" font-size="10.5">SOURCE</text><text class="t" x="22" y="62" fill="#f3f4f6" font-size="20">argus-asm</text><text class="s" x="22" y="86" fill="#cbd5e1" font-size="15" style="font-weight:500">Local-first Attack Surface</text><text class="s" x="22" y="107" fill="#cbd5e1" font-size="15" style="font-weight:500">Management CLI for defensive</text><text class="s" x="22" y="128" fill="#cbd5e1" font-size="15" style="font-weight:500">teams: scope-first asset</text><text class="s" x="22" y="149" fill="#cbd5e1" font-size="15" style="font-weight:500">inventory, findings import from</text><text class="s" x="22" y="170" fill="#cbd5e1" font-size="15" style="font-weight:500">CSV, JSON and SARIF, explainable</text><text class="s" x="22" y="191" fill="#cbd5e1" font-size="15" style="font-weight:500">risk scores, remediation tickets</text><text class="s" x="22" y="212" fill="#cbd5e1" font-size="15" style="font-weight:500">and a hash-chained audit log. One</text><text class="s" x="22" y="233" fill="#cbd5e1" font-size="15" style="font-weight:500">SQLite file, no account or server.</text><rect x="22.0" y="274" width="31.0" height="20" rx="10" fill="#38bdf814" stroke="#38bdf855"/><text class="m" x="37.5" y="288.5" text-anchor="middle" fill="#38bdf8" font-size="10.5">Go</text><rect x="59.0" y="274" width="61.0" height="20" rx="10" fill="#38bdf814" stroke="#38bdf855"/><text class="m" x="89.5" y="288.5" text-anchor="middle" fill="#38bdf8" font-size="10.5">SQLite</text><rect x="126.0" y="274" width="53.5" height="20" rx="10" fill="#38bdf814" stroke="#38bdf855"/><text class="m" x="152.8" y="288.5" text-anchor="middle" fill="#38bdf8" font-size="10.5">SARIF</text><rect x="185.5" y="274" width="46.0" height="20" rx="10" fill="#38bdf814" stroke="#38bdf855"/><text class="m" x="208.5" y="288.5" text-anchor="middle" fill="#38bdf8" font-size="10.5">Nmap</text><g clip-path="url(#c)"><rect x="-140" y="0" width="120" height="312" fill="url(#shine)" transform="skewX(-18)"><animateTransform attributeName="transform" type="translate" values="0 0;700 0" dur="6s" begin="0.7s" repeatCount="indefinite" additive="sum"/></rect></g></svg>
